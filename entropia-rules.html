<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENTROPIA – Rules</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root,[data-theme="light"]{
  --bg:#f5f5f7;--bg2:#ffffff;--bg3:#f0f0f3;--bg4:#e5e5ea;
  --border:rgba(0,0,0,0.09);
  --text:#1d1d1f;--text2:#515154;--text3:#909095;
  --orange:#ff6a00;--orange-soft:rgba(255,106,0,.12);
  --ok:#34c759;--purple:#bf5af2;--blue:#0a84ff;
  --shadow:0 2px 12px rgba(0,0,0,.06),0 8px 32px rgba(0,0,0,.05);
  --radius:16px;
}
[data-theme="dark"]{
  --bg:#0a0a0f;--bg2:#13131a;--bg3:#1c1c24;--bg4:#26262f;
  --border:rgba(255,255,255,0.09);
  --text:#f0f0f2;--text2:#a8a8ad;--text3:#67676d;
  --shadow:0 2px 12px rgba(0,0,0,.5),0 8px 32px rgba(0,0,0,.4);
}

html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  min-height:100vh;transition:background .25s,color .25s;
}

header{
  position:sticky;top:0;z-index:100;height:56px;
  display:flex;align-items:center;gap:12px;padding:0 20px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}
.back-link{color:var(--orange);text-decoration:none;font-size:13px;white-space:nowrap;transition:opacity .15s}
.back-link:hover{opacity:.6}
.brand{font-size:15px;font-weight:700;flex:1;letter-spacing:.05em}
.brand span{color:var(--orange)}

.theme-btn{
  background:none;border:1px solid var(--border);border-radius:8px;
  color:var(--text2);cursor:pointer;font-size:16px;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,color .15s;
}
.theme-btn:hover{border-color:var(--orange);color:var(--orange)}
.lang-btns{display:flex;gap:4px}
.lang-btn{
  background:none;border:1px solid var(--border);border-radius:7px;
  color:var(--text2);cursor:pointer;font-size:11px;font-weight:700;
  padding:0 7px;height:30px;transition:all .15s;font-family:inherit;
}
.lang-btn:hover{border-color:var(--orange);color:var(--orange)}
.lang-btn.active{background:var(--orange);border-color:var(--orange);color:#fff}

main{max-width:760px;margin:0 auto;padding:32px 20px 80px}

.page-hero{text-align:center;margin-bottom:40px}
.page-title{
  font-size:clamp(40px,12vw,72px);font-weight:900;
  letter-spacing:.12em;text-transform:uppercase;
  background:linear-gradient(135deg,#ff6a00 0%,#bf5af2 40%,#0a84ff 80%,#34c759 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1;margin-bottom:8px;
}
.page-sub{font-size:13px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase}

.section{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:24px 24px;margin-bottom:16px;
}
.section-icon{font-size:28px;margin-bottom:10px}
.section h2{font-size:17px;font-weight:800;margin-bottom:12px;color:var(--text)}
.section p{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:10px}
.section p:last-child{margin-bottom:0}
.section ul,.section ol{
  font-size:14px;color:var(--text2);line-height:1.7;
  padding-left:20px;margin-bottom:10px;
}
.section li{margin-bottom:5px}
.section li:last-child{margin-bottom:0}
strong{color:var(--text);font-weight:700}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:14px}
.card-type{
  border-radius:12px;padding:14px;border:1px solid var(--border);
  font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:5px;
}
.card-type .ct-icon{font-size:22px}
.card-type .ct-name{font-weight:800}
.card-type .ct-desc{font-size:12px;color:var(--text2);font-weight:500;line-height:1.4}

.field-types{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ft-pill{
  font-size:12px;font-weight:700;padding:5px 11px;border-radius:8px;
  display:flex;align-items:center;gap:5px;border:1px solid transparent;
}

.intent-scale{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.intent-row{display:flex;align-items:center;gap:10px;font-size:13px}
.intent-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.intent-label{font-weight:700;min-width:80px}
.intent-desc{color:var(--text2);line-height:1.4}

.philosophy-quote{
  border-left:3px solid var(--orange);padding:12px 16px;
  background:var(--orange-soft);border-radius:0 10px 10px 0;
  font-size:14px;color:var(--text2);line-height:1.6;font-style:italic;
  margin:12px 0;
}

.win-box{
  background:var(--bg3);border-radius:12px;padding:14px;border:1px solid var(--border);
  margin-top:10px;font-size:13px;color:var(--text2);line-height:1.6;
}
.win-box strong{display:block;margin-bottom:3px}

.toc{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.toc a{
  font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;
  background:var(--bg2);border:1px solid var(--border);color:var(--text2);
  text-decoration:none;transition:all .15s;
}
.toc a:hover{border-color:var(--orange);color:var(--orange)}

footer{text-align:center;padding:18px;font-size:12px;color:var(--text3)}
footer a{color:var(--orange);text-decoration:none}
</style>
</head>

/* =========================================================
   I18N
   ========================================================= */
const I18N = {
  lang: localStorage.getItem('entropia_lang') || 'en',
  set(l) {
    this.lang = l;
    localStorage.setItem('entropia_lang', l);
    document.documentElement.lang = l;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
    render();
  }
};
document.querySelectorAll('.lang-btn').forEach(b => {
  b.classList.toggle('active', b.dataset.lang === I18N.lang);
  b.addEventListener('click', () => I18N.set(b.dataset.lang));
});

/* =========================================================
   THEME
   ========================================================= */
const themeBtn = document.getElementById('theme-btn');
let currentTheme = localStorage.getItem('entropia_theme') || 'light';
document.documentElement.setAttribute('data-theme', currentTheme);
themeBtn.textContent = currentTheme === 'dark' ? '🌙' : '☀️';
themeBtn.addEventListener('click', () => {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);
  localStorage.setItem('entropia_theme', currentTheme);
  themeBtn.textContent = currentTheme === 'dark' ? '🌙' : '☀️';
});

/* =========================================================
   RENDER
   ========================================================= */
function render() {
  const C = CONTENT[I18N.lang] || CONTENT.en;
  document.documentElement.lang = I18N.lang;
  document.getElementById('page-sub').textContent = C.page_sub;
  document.getElementById('back-game').textContent = C.back_game;
  document.title = 'ENTROPIA – ' + C.page_sub;

  // TOC
  const toc = document.getElementById('toc');
  toc.innerHTML = C.toc.map((label,i) =>
    `<a href="#${C.sections[i].id}">${C.sections[i].icon} ${label}</a>`
  ).join('');

  // Sections
  const content = document.getElementById('rules-content');
  content.innerHTML = C.sections.map(s => `
    <div class="section" id="${s.id}">
      <div class="section-icon">${s.icon}</div>
      <h2>${s.title}</h2>
      ${s.body}
    </div>
  `).join('');
}

render();
</script>
