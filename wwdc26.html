<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WWDC 2026 – Feature Explorer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root,[data-theme="dark"]{
  --bg:#0d0d0d;--bg2:#141414;--bg3:#1c1c1c;--bg4:#242424;
  --border:rgba(255,255,255,0.08);
  --overlay-bg:rgba(0,0,0,.55);
  --text:#f0f0f0;--text2:#aaa;--text3:#555;
  --header-bg:rgba(13,13,13,.92);
  --filter-bg:rgba(13,13,13,.96);
  --panel-bg:#141414;--panel-close-bg:#141414;
  --hero-grad:linear-gradient(160deg,#ff6a00 0%,#ff9500 12%,#7a2800 38%,#1f0a00 62%,#0d0d0d 100%);
  --hero-sub:rgba(255,255,255,.65);
  --hero-stat-sub:rgba(255,255,255,.45);
  --scrollbar:#333;
}
[data-theme="light"]{
  --bg:#f5f5f7;--bg2:#ffffff;--bg3:#f0f0f3;--bg4:#e5e5ea;
  --border:rgba(0,0,0,0.09);
  --overlay-bg:rgba(0,0,0,.35);
  --text:#1d1d1f;--text2:#515154;--text3:#888;
  --header-bg:rgba(245,245,247,.92);
  --filter-bg:rgba(245,245,247,.97);
  --panel-bg:#fff;--panel-close-bg:#fff;
  --hero-grad:linear-gradient(160deg,#ff6a00 0%,#ff9500 14%,#ffb86b 38%,#ffe0c0 60%,#f5f5f7 100%);
  --hero-sub:rgba(0,0,0,.55);
  --hero-stat-sub:rgba(0,0,0,.42);
  --scrollbar:#ccc;
}

:root{
  --orange:#ff6a00;--amber:#ff9500;
  --radius:12px;--panel-w:440px;--hh:56px;
}

body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;overflow-x:hidden;transition:background .25s,color .25s}

/* HEADER */
header{position:sticky;top:0;z-index:100;height:var(--hh);background:var(--header-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px}
.back-link{color:var(--orange);text-decoration:none;font-size:13px;white-space:nowrap;transition:opacity .15s}
.back-link:hover{opacity:.6}
.hbrand{font-size:15px;font-weight:700;flex:1;color:var(--text)}
.hbrand span{color:var(--orange)}
.theme-btn{width:32px;height:32px;border-radius:50%;background:none;border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s;flex-shrink:0}
.theme-btn:hover{border-color:var(--orange);color:var(--orange)}
.lang-picker{display:flex;gap:2px}
.lbtn{background:none;border:1px solid var(--border);color:var(--text2);font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;cursor:pointer;transition:all .15s}
.lbtn:hover{border-color:var(--orange);color:var(--orange)}
.lbtn.active{background:var(--orange);border-color:var(--orange);color:#fff}

/* HERO */
.hero{background:var(--hero-grad);padding:64px 24px 52px;text-align:center;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,106,0,.2) 0%,transparent 70%);pointer-events:none}
.hero-eyebrow{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--amber);margin-bottom:10px;position:relative;z-index:1}
.hero-title{font-size:clamp(40px,8vw,72px);font-weight:800;letter-spacing:-2px;line-height:1;margin-bottom:8px;position:relative;z-index:1;color:#fff}
.hero-sub{font-size:clamp(14px,2.5vw,18px);font-weight:300;color:var(--hero-sub);margin-bottom:36px;position:relative;z-index:1}
.hero-stats{display:flex;justify-content:center;gap:48px;flex-wrap:wrap;position:relative;z-index:1}
.stat-num{font-size:36px;font-weight:800;color:var(--orange);line-height:1}
.stat-lbl{font-size:10px;color:var(--hero-stat-sub);text-transform:uppercase;letter-spacing:1px;margin-top:2px}

/* FILTER BAR */
.filter-bar{position:sticky;top:var(--hh);z-index:90;background:var(--filter-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 20px 10px;transition:background .25s}
.search-wrap{position:relative;margin-bottom:10px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;width:15px;height:15px}
#searchInput{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;padding:8px 12px 8px 34px;outline:none;transition:border-color .2s,background .25s,color .25s;-webkit-appearance:none}
#searchInput:focus{border-color:var(--orange)}
#searchInput::placeholder{color:var(--text3)}
.tabs-row{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;align-items:center}
.tabs-row::-webkit-scrollbar{display:none}
.tbtn{white-space:nowrap;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;transition:all .15s;flex-shrink:0}
.tbtn:hover{border-color:var(--orange);color:var(--orange)}
.tbtn.active{background:var(--orange);border-color:var(--orange);color:#fff}
.rinfo{font-size:11px;color:var(--text3);margin-left:auto;flex-shrink:0;padding-left:8px}

/* GRID */
.grid-wrap{padding:24px 20px;max-width:1400px;margin:0 auto}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

/* CARDS */
.fcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s,background .25s;display:flex;flex-direction:column;gap:10px;animation:cin .3s ease both}
.fcard:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.18)}
[data-theme="dark"] .fcard:hover{box-shadow:0 10px 30px rgba(0,0,0,.5)}
@keyframes cin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.cbadge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:4px;flex-shrink:0}
.dots{display:flex;gap:3px;align-items:center;padding-top:2px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--bg4)}
.dot.on{background:var(--orange)}
.dot.lg{width:10px;height:10px}
.card-title{font-size:15px;font-weight:700;line-height:1.3;color:var(--text)}
.card-desc{font-size:12px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{font-size:9px;font-weight:600;padding:2px 5px;border-radius:3px;background:var(--bg4);color:var(--text3);text-transform:uppercase;letter-spacing:.3px}
.pbtn{font-size:10px;font-weight:700;padding:4px 10px;border-radius:6px;border:1px solid var(--orange);background:none;color:var(--orange);cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
.pbtn:hover{background:var(--orange);color:#fff}
.pbtn.ok{background:#34d399;border-color:#34d399;color:#fff}
mark{background:rgba(255,149,0,.3);color:inherit;border-radius:2px}
.no-res{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text3);font-size:16px}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:var(--overlay-bg);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.on{opacity:1;pointer-events:all}

/* SIDE PANEL */
.panel{position:fixed;top:0;right:0;bottom:0;width:var(--panel-w);max-width:100vw;background:var(--panel-bg);border-left:1px solid var(--border);z-index:210;transform:translateX(100%);transition:transform .35s cubic-bezier(.32,.72,0,1),background .25s}
.panel.open{transform:translateX(0)}
.panel-close-row{position:sticky;top:0;display:flex;justify-content:flex-end;padding:14px 16px 0;z-index:10;background:var(--panel-close-bg);transition:background .25s}
.xbtn{width:32px;height:32px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s}
.xbtn:hover{background:var(--orange);border-color:var(--orange);color:#fff}
.pbody{padding:16px 24px 48px}
.panel-title{font-size:26px;font-weight:800;line-height:1.2;margin:10px 0 14px;color:var(--text)}
.pmeta{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ilbl{font-size:11px;color:var(--text3);letter-spacing:1.5px}
.pdesc{font-size:14px;line-height:1.75;color:var(--text2);margin:16px 0 20px}
.sunion{border-left:3px solid var(--orange);padding:10px 14px 10px 16px;margin:0 0 20px;background:rgba(255,106,0,.07);border-radius:0 8px 8px 0;font-size:13px;font-style:italic;color:var(--text2);line-height:1.65;position:relative}
[data-theme="light"] .sunion{background:rgba(255,106,0,.06)}
.sunion-src{display:block;font-size:10px;color:var(--orange);font-style:normal;margin-top:6px;font-weight:600;letter-spacing:.3px;opacity:.8}
.divider{border:none;border-top:1px solid var(--border);margin:18px 0}
.plinks{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.plink{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius);border:1px solid var(--border);text-decoration:none;color:var(--text);font-size:13px;font-weight:500;transition:all .15s;background:var(--bg3)}
.plink:hover{border-color:var(--orange);color:var(--orange)}
.plink.prime{border-color:var(--orange);color:var(--orange)}
.plink.prime:hover{background:var(--orange);color:#fff}
.pvid-title{font-size:11px;color:var(--text3);margin-top:2px;font-weight:400;line-height:1.3}
.prompt-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:background .25s}
.prompt-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ptitle{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3)}
.pnote{font-size:10px;color:var(--text3);flex:1}
.cpbtn{font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;border:1px solid var(--orange);background:none;color:var(--orange);cursor:pointer;transition:all .15s}
.cpbtn:hover{background:var(--orange);color:#fff}
.cpbtn.ok{background:#34d399;border-color:#34d399;color:#fff}
.prompt-text{padding:12px 14px;font-size:12px;line-height:1.65;color:var(--text2);white-space:pre-wrap;word-break:break-word;font-family:inherit}
.panel::-webkit-scrollbar{width:4px}
.panel::-webkit-scrollbar-track{background:transparent}
.panel::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:2px}

@media(max-width:600px){
  :root{--panel-w:100vw}
  .hero{padding:40px 16px 36px}
  .hero-stats{gap:28px}
  .filter-bar{padding:10px 14px 8px}
  .grid-wrap{padding:14px 12px}
  .card-grid{grid-template-columns:1fr}
  header{padding:0 14px}
  .pbody{padding:12px 16px 40px}
}
</style>
</head>
<body>

<header>
  <a href="labs.html" class="back-link" data-i18n="back">← Labs</a>
  <div class="hbrand">WWDC <span>2026</span></div>
  <button class="theme-btn" id="themeBtn" title="Toggle theme">🌙</button>
  <div class="lang-picker">
    <button class="lbtn" onclick="setLang('en')">EN</button>
    <button class="lbtn" onclick="setLang('da')">DA</button>
    <button class="lbtn" onclick="setLang('es')">ES</button>
    <button class="lbtn" onclick="setLang('zh')">中文</button>
  </div>
</header>

<section class="hero">
  <div class="hero-eyebrow">WWDC 2026</div>

</section>

<div class="filter-bar">
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" id="searchInput" data-i18n-ph="search_ph">
  </div>
  <div class="tabs-row" id="tabs">
    <button class="tbtn active" data-tab="all" data-i18n="t_all">All</button>
    <button class="tbtn" data-tab="ios">iOS</button>
    <button class="tbtn" data-tab="ipados">iPadOS</button>
    <button class="tbtn" data-tab="macos">macOS</button>
    <button class="tbtn" data-tab="watchos">watchOS</button>
    <button class="tbtn" data-tab="visionos">visionOS</button>
    <button class="tbtn" data-tab="carplay">CarPlay</button>
    <button class="tbtn" data-tab="ai" data-i18n="t_ai">AI</button>
    <span class="rinfo" id="rinfo"></span>
  </div>
</div>

<div class="grid-wrap">
  <div class="card-grid" id="cardGrid"></div>
</div>

<div class="overlay" id="overlay"></div>
<aside class="panel" id="panel">
  <div class="panel-close-row"><button class="xbtn" id="xbtn">✕</button></div>
  <div class="pbody" id="pbody"></div>
</aside>

         desc:'The system keyboard automatically inserts correct punctuation across multilingual keyboards, understanding context to place commas, periods, and question marks intelligently.' },

    url:'https://www.apple.com/ios/', vid:null,
    prompt:'Explain the automatic punctuation feature in iOS 27 and macOS 27 announced at WWDC 2026. How does it work across multilingual keyboard inputs? What models power the punctuation prediction, and how can developers integrate with or customize this behavior?' },

  { id:'liquid-glass', cat:'performance', plat:['ios','ipados','macos','visionos'], impact:3,
    en:{ title:'Liquid Glass Design',
         desc:'The refined Liquid Glass UI system brings an opacity slider for customizable transparency, more consistent corner radii, and cohesive icons across iOS, iPadOS, macOS, and visionOS.' },
    da:{ title:'Liquid Glass Design',
         desc:'Det raffinerede Liquid Glass UI-system bringer en opacitetsskyder til justerbar gennemsigtighed, mere konsistente hjørneradier og sammenhængende ikoner på tværs af platforme.' },
    url:'https://developer.apple.com/design/',
    vid:{ url:BASE+'250/', title:'Principles of great design' },
    quote:'The new design with liquid glass is more consistent, more personalizable, and better tuned to maintain exceptional readability. Every window on macOS shares the same tighter corner radius. App icons get sharper rendering automatically, and you can add new refraction effects in Icon Composer.',
    prompt:'Describe the Liquid Glass design language refinements at WWDC 2026. What specific changes were made to readability, opacity controls, and corner radius consistency? How do developers adopt these changes using SwiftUI and UIKit APIs?' },

  { id:'siri-ai', cat:'ai', plat:['ios','ipados','macos','watchos'], impact:3,
    en:{ title:'New Siri AI',
         desc:'Siri receives a transformative upgrade with conversational context, on-screen awareness, and deep app integration. Powered by Apple\'s on-device models and optional integration with Gemini and other AI partners.' },
    da:{ title:'Ny Siri AI',
         desc:'Siri får en transformativ opgradering med konversationskontekst, on-screen awareness og dyb app-integration. Drevet af Apples on-device-modeller og valgfri Gemini-integration.' },
    url:'https://www.apple.com/apple-intelligence/',
    vid:{ url:BASE+'121/', title:"Announcing Apple's next big step for Siri and iPhone" },
    quote:'App Intents connect your app to Apple Intelligence, making your users\' content discoverable and your app\'s actions available through natural language in Siri. And the new View Annotations API even lets people act on what\'s on screen just by asking. Together, in-app and system-wide intelligence unlock experiences neither could deliver alone.',
    prompt:'Explain the complete overhaul of Siri announced at WWDC 2026. What are the specific capabilities of the new conversational context system and on-screen awareness? How does Siri integrate with third-party apps via App Intents? How does Gemini integration work, and what are the privacy implications of the hybrid on-device/cloud model?' },

  { id:'apple-intelligence', cat:'ai', plat:['ios','ipados','macos'], impact:3,
    en:{ title:'Apple Intelligence 2.0',
         desc:'Major updates bring enhanced photo editing (Cleanup, Extend, Spatial Reframe), smarter cross-app suggestions, updated Genmoji and Image Playground, and broader on-device model capabilities.' },
    da:{ title:'Apple Intelligence 2.0',
         desc:'Store opdateringer bringer forbedret fotoredigering (Cleanup, Extend, Spatial Reframe), smartere tværs-app-forslag og opdateret Genmoji og Image Playground.' },
    url:'https://www.apple.com/apple-intelligence/',
    vid:{ url:BASE+'241/', title:"What's new in the Foundation Models framework" },
    quote:'Apple Intelligence has been rebuilt from the ground up. Working together with Google and leveraging the technologies behind their Gemini family of models, we created the latest Apple Foundation Models for our integrated Apple Intelligence experiences. The Foundation Models framework expands to include image input and support for cloud models. So if you have a more complex task requiring more advanced frontier models, the API can now integrate with the cloud model provider of your choice.',
    prompt:'What new capabilities does Apple Intelligence 2.0 bring at WWDC 2026? Explain the new photo editing features (Cleanup, Extend, Spatial Reframe), how cross-app context awareness works, updates to Genmoji and Image Playground, and what new Foundation Models APIs are available to developers.' },

  { id:'ai-dictation', cat:'ai', plat:['ios','ipados','macos'], impact:2,
    en:{ title:'AI Dictation System-Wide',
         desc:'Intelligent dictation now auto-corrects spelling, adds proper punctuation, and removes filler words (um, uh) in real time. Works in any text field with improved accuracy in 40+ languages.' },
    da:{ title:'AI-diktat systemvidt',
         desc:'Intelligent diktat retter nu stavefejl, tilføjer korrekt tegnsætning og fjerner automatisk fyldord i realtid. Fungerer i ethvert tekstfelt med forbedret nøjagtighed.' },
    url:'https://www.apple.com/apple-intelligence/',
    vid:{ url:BASE+'334/', title:'Build AI-powered scripts with the fm CLI and Python SDK' },
    prompt:'Explain the AI dictation improvements announced at WWDC 2026. How does real-time filler word removal work? What models power spelling correction and punctuation insertion? Are there new Speech framework APIs that third-party apps can leverage for improved dictation?' },

  { id:'smart-shortcuts', cat:'ai', plat:['ios','ipados','macos'], impact:2,
    en:{ title:'Smart Shortcuts',
         desc:'Describe automations in natural language and Siri builds the Shortcut for you. The Shortcuts app gains AI-powered action suggestions and understands complex multi-step requests.' },
    da:{ title:'Smarte genveje',
         desc:'Beskriv automatiseringer med naturligt sprog, og Siri bygger genvejen for dig. Genveje-appen får AI-drevne handlingsforslag og forstår komplekse flertrins-anmodninger.' },
    url:'https://www.apple.com/ios/',
    vid:{ url:BASE+'310/', title:"What's new in Shortcuts" },
    quote:'We included dynamic profiles to help you build AI agents and skills with a lot less code by swapping tools in and out and updating instructions on the fly. App Intents connect your app to Apple Intelligence, making your users\' content discoverable and your app\'s actions available through natural language in Siri.',
    prompt:'Describe the natural language Shortcuts creation announced at WWDC 2026. How does the AI understand complex automation requests? What are the current limits? What App Intents API changes allow third-party apps to be used in AI-generated Shortcuts?' },

         desc:'Systemtastaturet får smart sprogdetektering der skifter automatisk, bedre autokorrektur der lærer præferencer og forbedret stemmeinput med realtidstranskription på 40+ sprog.' },
    url:'https://www.apple.com/ios/',
    vid:{ url:BASE+'213/', title:'Translate your app using agents in Xcode' },
    prompt:'What keyboard and voice input improvements were announced for iOS 27 and macOS 27 at WWDC 2026? How does multilingual smart language detection work? What improvements were made to autocorrect personalization? How was voice input transcription accuracy improved across languages?' },

  { id:'grammar-check', cat:'language', plat:['ios','ipados','macos'], impact:1,
    en:{ title:'Grammar & Punctuation AI',
         desc:'System-wide grammar checking expands to more languages with improved suggestions, and punctuation AI now works in third-party apps via text input APIs for consistent writing quality everywhere.' },
    da:{ title:'Grammatik og tegnsætnings-AI',
         desc:'Systemdækkende grammatikkontrol udvides til flere sprog med forbedrede forslag, og tegnsætnings-AI fungerer nu i tredjepartsapps via tekstinput-API\'er.' },
    url:'https://www.apple.com/ios/', vid:null,
    prompt:'Explain the grammar checking and punctuation AI improvements in iOS 27 and macOS 27 at WWDC 2026. How does system-wide grammar checking work across more languages? How can third-party apps integrate with the punctuation AI via text input APIs? What NaturalLanguage framework changes support this?' }
];

let lang = localStorage.getItem('wwdc26_lang') || 'en';
let tab = 'all';
let q = '';

function T(k) { return (TR[lang]||TR.en)[k] || TR.en[k] || k; }
function FL(f) { return (lang==='da' && f.da) ? 'da' : 'en'; }

function hexRgba(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function hl(txt, sq) {
  if (!sq) return txt;
  const re = new RegExp(`(${sq.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return txt.replace(re, '<mark>$1</mark>');
}

function dots(n, lg) {
  return [1,2,3].map(i=>`<span class="dot${lg?' lg':''}${i<=n?' on':''}"></span>`).join('');
}
function chips(plats) {
  return plats.map(p=>`<span class="chip">${PN[p]||p}</span>`).join('');
}

function getFiltered() {
  return FEATURES.filter(f => {
    const matchTab = tab === 'all' ? true : tab === 'ai' ? f.cat === 'ai' : f.plat.includes(tab);
    if (!matchTab) return false;
    if (!q) return true;
    const lq = q.toLowerCase();
    const l = FL(f);
    return f[l].title.toLowerCase().includes(lq) ||
           f[l].desc.toLowerCase().includes(lq) ||
           f.en.title.toLowerCase().includes(lq) ||
           f.cat.toLowerCase().includes(lq);
  });
}

function renderCards() {
  const grid = document.getElementById('cardGrid');
  const sq = q.toLowerCase();
  const filtered = getFiltered();
  document.getElementById('rinfo').textContent = filtered.length + ' ' + T('res_lbl');

  if (!filtered.length) {
    grid.innerHTML = `<div class="no-res">${T('no_res')}</div>`;
    return;
  }
  grid.innerHTML = '';
  filtered.forEach((f, i) => {
    const l = FL(f);
    const c = CC[f.cat];
    const card = document.createElement('div');
    card.className = 'fcard';
    card.dataset.fid = f.id;
    card.style.borderTop = `3px solid ${c}`;
    card.style.animationDelay = (i * 25) + 'ms';
    card.innerHTML = `
      <div class="card-head">
        <span class="cbadge" style="color:${c};background:${hexRgba(c,.15)}">${T('cat_'+f.cat)}</span>
        <div class="dots">${dots(f.impact,false)}</div>
      </div>
      <div class="card-title">${hl(f[l].title, sq)}</div>
      <div class="card-desc">${hl(f[l].desc, sq)}</div>
      <div class="card-foot">
        <div class="chips">${chips(f.plat)}</div>
        <button class="pbtn" data-fid="${f.id}">${T('pbtn')}</button>
      </div>`;
    grid.appendChild(card);
  });
}

function openPanel(id) {
  const f = FEATURES.find(x => x.id === id);
  if (!f) return;
  const l = FL(f);
  const c = CC[f.cat];
  document.getElementById('panel').dataset.fid = id;
  const vidHtml = f.vid ? `
    <a class="plink" href="${f.vid.url}" target="_blank" rel="noopener">
      <span>▶</span>
      <span>
        <span style="display:block">${T('watch_s')}</span>
        <span class="pvid-title">${f.vid.title}</span>
      </span>
    </a>` : '';
  document.getElementById('pbody').innerHTML = `
    <span class="cbadge" style="color:${c};background:${hexRgba(c,.15)}">${T('cat_'+f.cat)}</span>
    <h2 class="panel-title">${f[l].title}</h2>
    <div class="pmeta">
      <div class="dots">${dots(f.impact,true)}</div>
      <span class="ilbl">${T('impact')}: ${'●'.repeat(f.impact)}${'○'.repeat(3-f.impact)}</span>
    </div>
    <div class="chips" style="margin-bottom:4px">${chips(f.plat)}</div>
    <p class="pdesc">${f[l].desc}</p>
    ${f.quote ? `<blockquote class="sunion">${f.quote}<span class="sunion-src">— Platform State of the Union · WWDC 2026</span></blockquote>` : ''}
    <hr class="divider">
    <div class="plinks">
      <a class="plink prime" href="${f.url}" target="_blank" rel="noopener">🍎 ${T('apple_pg')}</a>
      ${vidHtml}
    </div>
    <div class="prompt-box">
      <div class="prompt-head">
        <span class="ptitle">${T('llm_lbl')}</span>
        <span class="pnote">${T('p_note')}</span>
        <button class="cpbtn" id="cpbtn" onclick="copyPanelPrompt(this)">${T('copy')}</button>
      </div>
      <pre class="prompt-text">${f.prompt}</pre>
    </div>`;
  document.getElementById('panel').classList.add('open');
  document.getElementById('overlay').classList.add('on');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('on');
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('ok');
    const orig = btn.textContent;
    btn.textContent = T('copied');
    setTimeout(() => { btn.classList.remove('ok'); btn.textContent = orig; }, 1800);
  });
}

function copyPanelPrompt(btn) {
  const id = document.getElementById('panel').dataset.fid;
  const f = FEATURES.find(x => x.id === id);
  if (f) copyText(f.prompt, btn);
}

function setLang(l) {
  lang = l;
  localStorage.setItem('wwdc26_lang', l);
  applyLang();
  renderCards();
  const pid = document.getElementById('panel').dataset.fid;
  if (document.getElementById('panel').classList.contains('open') && pid) openPanel(pid);
}

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = T(el.dataset.i18n); if (v) el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    el.placeholder = T(el.dataset.i18nPh);
  });
  document.querySelectorAll('.lbtn').forEach(b => {
    b.classList.toggle('active',
      (lang !== 'zh' && b.textContent === lang.toUpperCase()) ||
      (lang === 'zh' && b.textContent === '中文')
    );
  });
}

// Theme
const html = document.documentElement;
const saved = localStorage.getItem('wwdc26_theme') || 'dark';
html.setAttribute('data-theme', saved);
document.getElementById('themeBtn').textContent = saved === 'dark' ? '☀️' : '🌙';

document.getElementById('themeBtn').addEventListener('click', () => {
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('wwdc26_theme', next);
});

// Events
document.getElementById('searchInput').addEventListener('input', e => {
  q = e.target.value; renderCards();
});
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tbtn');
  if (!btn) return;
  document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  tab = btn.dataset.tab;
  renderCards();
});
document.getElementById('cardGrid').addEventListener('click', e => {
  const pbtn = e.target.closest('.pbtn');
  if (pbtn) {
    e.stopPropagation();
    const f = FEATURES.find(x => x.id === pbtn.dataset.fid);
    if (f) copyText(f.prompt, pbtn);
    return;
  }
  const card = e.target.closest('.fcard');
  if (card) openPanel(card.dataset.fid);
});
document.getElementById('xbtn').addEventListener('click', closePanel);
document.getElementById('overlay').addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

applyLang();
renderCards();
</script>
</body>
</html>
